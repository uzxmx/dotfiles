# Ref: https://yazi-rs.github.io/docs/configuration/yazi
#
# Only overrides are listed here; everything else uses yazi's defaults.

[mgr]
show_hidden = true
# Newest first, like `l` (ls -1tA).
sort_by = "mtime"
sort_reverse = true
sort_dir_first = true
# Parent : current : preview. Wider preview than the default [1, 4, 3].
ratio = [1, 3, 4]

[preview]
# Defaults (600x900) are in physical pixels, so images look tiny on Retina
# screens. Raise them (enough for a 4K screen) so images fill the preview pane,
# even when maximized with `T`; the pane size still caps the actual size.
# Images are never upscaled. Run `ya cache clear` after changing these.
max_width = 4000
max_height = 4000

# git.yazi: show git status of files and directories.
# Ref: https://github.com/yazi-rs/plugins/tree/main/git.yazi
[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
