# Ref: https://yazi-rs.github.io/docs/configuration/keymap
#
# Only additions/overrides are listed here; default keybindings still apply.

# fr.yazi: search file contents via rg, filter with fzf, preview with bat.
# In fzf: ctrl-s toggles rg/fzf matching, ctrl-r reloads.
[[mgr.prepend_keymap]]
on = "s"
run = "plugin fr rg"
desc = "Search file contents via rg + fzf"

# Overrides the default `S` (search file contents via rg).
[[mgr.prepend_keymap]]
on = "S"
run = "search --via=fd --args='--hidden'"
desc = "Search files by name via fd (including hidden files)"

[[mgr.prepend_keymap]]
on = "l"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

# Overrides the default `f` (filter), which moves to `F` (unbound by default).
[[mgr.prepend_keymap]]
on = "f"
run = "plugin fzf"
desc = "Jump to a file/directory via fzf"

[[mgr.prepend_keymap]]
on = "F"
run = "filter --smart"
desc = "Filter files"

# Overrides the default `z` (fzf, now on `f`); same as `Z`.
[[mgr.prepend_keymap]]
on = "z"
run = "plugin zoxide"
desc = "Jump to a directory via zoxide"

# toggle-pane.yazi: maximize the preview pane (e.g. to view images), or
# restore it.
[[mgr.prepend_keymap]]
on = "T"
run = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

# zoom.yazi: enlarge or shrink the image preview (needs ImageMagick >= 7.1.1).
# Overrides the default `-` (symlink yanked files by absolute path); `_` still
# symlinks them by relative path.
[[mgr.prepend_keymap]]
on = "+"
run = "plugin zoom 1"
desc = "Zoom in the image preview"

[[mgr.prepend_keymap]]
on = "-"
run = "plugin zoom -1"
desc = "Zoom out the image preview"
